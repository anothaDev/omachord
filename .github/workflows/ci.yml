name: CI

on:
  # Branch pushes are covered by pull_request; push runs only for the default
  # branch and release tags so a PR branch is not tested twice.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Omachord needs GNU mv >= 9.5; Ubuntu 24.04 only provides coreutils 9.4.
    # debian:trixie-slim pinned by manifest-list digest (resolved 2026-09-26).
    # Dependabot does not update this; refresh the digest deliberately.
    container:
      image: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
      options: --init
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C.UTF-8
    steps:
      - name: Install portable test dependencies
        run: |
          apt-get update
          # Match Omarchy's Unicode shortcut case folding; Debian defaults to mawk.
          apt-get install --yes --no-install-recommends \
            ca-certificates coreutils desktop-file-utils gawk git jq lua5.4 nodejs \
            perl procps psmisc python3 sound-theme-freedesktop strace util-linux
          # Permission-denial regressions must not run as the container's root user.
          useradd --create-home --shell /bin/bash test-runner

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate portable source
        run: |
          for file in bin/omachord test/*.sh test/render/render.sh test/qml-runtime/fake-*; do
            bash -n "$file"
          done
          perl -c bin/omachord-fs
          perl -c bin/omachord-action-supervisor
          jq -e '
            .schemaVersion == 1 and .id == "anothadev.omachord"
            and (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
            and (.kinds | sort) == ["bar-widget", "panel", "service"]
            and .entryPoints == {panel: "Panel.qml", service: "Service.qml", barWidget: "BarWidget.qml"}
          ' manifest.json >/dev/null
          if [[ ${GITHUB_REF_TYPE:-} == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(jq -r .version manifest.json)"
          fi
          for file in Panel.qml Service.qml BarWidget.qml BrandIcon.qml \
            Collapsible.qml EmptyState.qml KeyCap.qml PanelScrollBar.qml \
            RoutinePopup.qml ThemePalette.qml ProcessWatchdog.qml Runner.js \
            assets/omachord-icon.svg assets/omachord-white.svg assets/omachord-black.svg; do
            test -s "$file"
          done
          desktop-file-validate desktop/anothadev.omachord.desktop
          node test/model-test.mjs
          node test/conditions-test.mjs
          node test/qml-plain-text-test.mjs
          node test/qml-policy-test.mjs

      - name: Test filesystem transactions
        run: |
          runuser -u test-runner -- python3 test/production-instrumentation-test.py
          runuser -u test-runner -- test/fs-helper-test.sh
          runuser -u test-runner -- python3 test/fs-recovery-test.py

      - name: Test action supervision
        run: |
          runuser -u test-runner -- test/action-supervisor-test.sh
          runuser -u test-runner -- python3 test/action-capture-test.py
          runuser -u test-runner -- python3 test/action-cancellation-test.py

      - name: Test runner integration with mocked desktop commands
        run: |
          runuser -u test-runner -- test/runner-test.sh
          runuser -u test-runner -- test/runner-lifecycle-test.sh
          runuser -u test-runner -- python3 test/brightness-test.py
          runuser -u test-runner -- test/authorization-test.sh
          runuser -u test-runner -- test/manual-revision-test.sh
          runuser -u test-runner -- python3 test/automatic-trigger-test.py
          runuser -u test-runner -- python3 test/runner-parsing-staging-test.py
          runuser -u test-runner -- python3 test/panel-capture-test.py

      - name: Test runner fast paths and detached audio
        run: runuser -u test-runner -- test/runner-speed-test.sh

      - name: Record integration-test boundary
        run: |
          printf '%s\n' 'Omarchy, Hyprland, Quickshell, and runtime QML checks run in the documented local release gate.'
